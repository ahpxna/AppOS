# =========================================================
# L3 -- BROWSER RUNTIME (OpenClaw gateway + Chrome sidecar)
#
# This overlay is the fallback containerized OpenClaw setup. The preferred
# deployment is native OpenClaw under a dedicated OS user with its own
# browser profile/tab; keep this file around for environments where that
# is not practical.
#
#   docker compose -f docker-compose.yml -f docker-compose.openclaw.yml up -d
#
# First run only:
#   docker compose -f docker-compose.yml -f docker-compose.openclaw.yml \
#     run --rm openclaw onboard
#
# Then open http://127.0.0.1:18789 and paste OPENCLAW_GATEWAY_TOKEN
# into Settings -> token.
# =========================================================

services:
  openclaw:
    image: ${OPENCLAW_IMAGE:-khal3d/openclaw:latest}
    container_name: jobos-openclaw
    restart: unless-stopped
    ports:
      # Bound to loopback only. This agent can drive a logged-in browser;
      # it must never be reachable from the LAN.
      - "127.0.0.1:18789:18789"   # Gateway UI / API
      - "127.0.0.1:18791:18791"   # Bridge
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      # Points the browser tool at the Chrome sidecar. Without a reachable
      # CDP endpoint the browser tool stays inactive.
      OPENCLAW_BROWSER_CDP_URL: http://browser:9222
      OPENCLAW_BROWSER_ALLOW_EVAL: "false"
    volumes:
      - ./data/openclaw-config:/root/.openclaw
      - ./data/openclaw-workspace:/workspace
    depends_on:
      - browser
    networks:
      - jobos
    deploy:
      resources:
        limits:
          # A runaway agent should not be able to OOM the host.
          memory: 4g

  browser:
    # kasmweb/chrome's own startup script wraps Chrome in a full Xvfb +
    # window-manager + noVNC desktop. That's the right choice when you
    # need to log into a site by hand once (LinkedIn, Workday), but its
    # startup script does NOT take a --remote-debugging-port flag through
    # to Chrome the way OpenClaw needs, and hand-rolling a bypass
    # entrypoint that skips the script entirely (`bash -c "google-chrome
    # --remote-debugging-port=9222 ..."`) fails for a different reason:
    # there is no Xvfb running to give non-headless Chrome a DISPLAY, so
    # the process exits immediately and 9222 never opens. Confirmed live
    # 2026-08-01.
    #
    # Fix: run actual headless Chrome (--headless=new) instead of fighting
    # the display requirement. CDP doesn't care whether Chrome is headed
    # or headless -- OpenClaw's "remote" profile only needs a reachable
    # CDP endpoint, not a visible desktop. This sacrifices the noVNC
    # manual-login desktop (port 6901, VNC_PW) on purpose, same tradeoff
    # already agreed: CDP first, VNC later if actually needed.
    image: kasmweb/chrome:1.16.0
    container_name: jobos-browser
    restart: unless-stopped
    user: root
    entrypoint: []
    command: >
      google-chrome
      --headless=new
      --no-sandbox
      --disable-dev-shm-usage
      --disable-gpu
      --remote-debugging-port=9222
      --remote-debugging-address=0.0.0.0
      --user-data-dir=/tmp/chrome-profile
    # Chrome crashes silently without enough shared memory -- this still
    # applies in headless mode. Do not drop this when editing the command
    # above; it's not related to the entrypoint override.
    shm_size: 1gb
    ports:
      - "127.0.0.1:9222:9222"     # CDP (consumed by openclaw)
    # Required so the openclaw container can resolve http://browser:9222
    # by service name (see OPENCLAW_BROWSER_CDP_URL below). Dropping this
    # network from an edited copy of this block silently breaks openclaw
    # -> browser connectivity even though `curl localhost:9222` from the
    # host still works fine (that path goes through the published port,
    # not the internal network).
    networks:
      - jobos
    deploy:
      resources:
        limits:
          memory: 4g

networks:
  jobos:
    driver: bridge
