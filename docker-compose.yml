services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

  n8n:
    image: n8nio/n8n:latest
    container_name: jobos-n8n
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_DISABLED: ${N8N_USER_MANAGEMENT_DISABLED}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/New_York
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  # Opt-in background LLM worker. It is intentionally profile-gated: enabling
  # a token API can incur cost, so it never starts merely because Postgres does.
  # Once enabled it drains every queued JD, including filtered-out postings.
  market-intelligence-worker:
    profiles: ["market-intelligence"]
    build:
      context: .
      dockerfile: Dockerfile.market-intelligence
    container_name: jobos-market-intelligence
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      JOBOS_DB_HOST: postgres
      JOBOS_DB_PORT: 5432
    volumes:
      - ./:/app:ro
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
          python services/discovery/market_demand_intelligence_v1.py process --apply || true;
          sleep "$$JOBOS_MARKET_WORKER_POLL_SECONDS";
        done

volumes:
  postgres_data:
  n8n_data:
