<!doctype html><meta charset="utf-8"><title>JobOS Fake ATS — Basic</title>
<form aria-label="Application for Job 123">
  <label>First name <input aria-label="First name" name="first_name"></label>
  <label>Last name <input aria-label="Last name" name="last_name"></label>
  <label>Email <input aria-label="Email" name="email" type="email"></label>
  <label>Phone <input aria-label="Phone" name="phone"></label>
  <label>Address <input aria-label="Address" name="address"></label>
  <label>University <input aria-label="University" name="university"></label>
  <label>Degree <input aria-label="Degree" name="degree"></label>
  <label>Major <input aria-label="Major" name="major"></label>
  <label>Graduation date <input aria-label="Graduation date" name="graduation"></label>
  <label>State <select aria-label="State" name="state"><option value="">Choose</option><option value="NJ">New Jersey</option></select></label>
  <fieldset><legend>Are you authorized to work in the United States?</legend><label><input type="radio" name="authorized" value="Yes"> Yes</label><label><input type="radio" name="authorized" value="No"> No</label></fieldset>
  <fieldset><legend>Will you now or in the future require sponsorship?</legend><label><input type="radio" name="sponsorship" value="Yes"> Yes</label><label><input type="radio" name="sponsorship" value="No"> No</label></fieldset>
  <label><input type="checkbox" name="terms"> I confirm this information is accurate</label>
</form>
