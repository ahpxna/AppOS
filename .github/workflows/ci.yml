name: JobOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-v1.txt
            services/*/requirements.txt
      - name: Install constrained dependencies
        run: python -m pip install -r requirements.txt -c constraints-v1.txt
      - name: Compile production code
        run: python -m compileall -q scripts services
      - name: Validate shell entrypoints
        run: bash -n scripts/*.sh
      - name: Lint migrations
        run: python scripts/migration_lint.py
      - name: Run non-DB regression suite
        run: python -m pytest -q --ignore=tests/integration
      - name: Build deterministic source release
        run: python scripts/build_release.py --output dist/jobos-v0.1.0-source.zip
      - name: Verify packaged release manifest
        run: |
          unzip -q dist/jobos-v0.1.0-source.zip -d dist/jobos-v0.1.0-source
          python scripts/build_release.py --verify-manifest dist/jobos-v0.1.0-source

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: jobos
          POSTGRES_PASSWORD: jobos_ci_test_password
          POSTGRES_DB: jobos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobos -d jobos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_PASSWORD: jobos_ci_test_password
      JOBOS_DB_HOST: 127.0.0.1
      JOBOS_DB_PORT: "5432"
      JOBOS_DB_NAME: jobos_test
      JOBOS_DB_USER: jobos
      JOBOS_RUN_DB_INTEGRATION: "1"
      JOBOS_TEST_DSN: host=127.0.0.1 port=5432 dbname=jobos_test user=jobos password=jobos_ci_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-v1.txt
      - name: Install constrained dependencies
        run: python -m pip install -r requirements.txt -c constraints-v1.txt
      - name: Apply fresh schema
        run: python scripts/apply_migrations.py
      - name: Run PostgreSQL lifecycle gates
        run: python -m pytest -q tests/integration test_autofill_execution_db_integration.py
